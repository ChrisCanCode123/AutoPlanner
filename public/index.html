<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AutoPlanner</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#09090b">
    <style>
        :root { 
            color-scheme: light; 
            --primary: #4f46e5; 
            --bg: #f4f4f5; 
            --card-bg: #ffffff; 
            --text-main: #09090b; 
            --text-muted: #71717a; 
            --line-color: #e4e4e7; 
            --success: #10b981;
            --danger: #ef4444;
            --radius-md: 14px;
            --radius-sm: 10px;
        }
        
        body.theme-emerald { --primary: #10b981; }
        body.theme-rose { --primary: #f43f5e; }
        body.theme-amber { --primary: #f59e0b; }
        body.theme-amethyst { --primary: #8b5cf6; }

        body.dark-mode { 
            color-scheme: dark; 
            --bg: #09090b; 
            --card-bg: #18181b; 
            --text-main: #fafafa; 
            --text-muted: #a1a1aa; 
            --line-color: #27272a; 
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; overflow: hidden; transition: background-color 0.2s; }
        
        header { position: sticky; top: 0; background-color: rgba(var(--card-bg-rgb), 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); padding: 20px 24px; font-size: 22px; font-weight: 800; border-bottom: 1px solid var(--line-color); display: flex; justify-content: space-between; align-items: center; z-index: 100; letter-spacing: -0.5px; }
        .header-actions { display: flex; gap: 16px; align-items: center; }
        .header-actions button { background: none; border: none; cursor: pointer; color: var(--text-muted); display: flex; align-items: center; transition: color 0.2s; }
        
        nav { position: fixed; bottom: 0; left: 0; width: 100%; background-color: rgba(var(--card-bg-rgb), 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--line-color); display: flex; justify-content: space-around; padding: 12px 0 calc(12px + env(safe-area-inset-bottom)); z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-muted); background: none; border: none; font-size: 12px; font-weight: 600; cursor: pointer; padding: 6px 12px; gap: 4px; }
        .nav-item.active { color: var(--text-main); }
        .nav-item svg { stroke-width: 2.5; opacity: 0.6; }
        .nav-item.active svg { opacity: 1; stroke: var(--primary); }

        :root { --card-bg-rgb: 255, 255, 255; }
        body.dark-mode { --card-bg-rgb: 24, 24, 27; }

        #auth-screen { position: fixed; inset: 0; background: var(--bg); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 30px; text-align: center; }
        #app-container { display: none; flex-direction: column; height: 100%; width: 100%; }
        main { flex-grow: 1; overflow-y: auto; padding: 16px; padding-bottom: 110px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        input, select, textarea { width: 100%; padding: 14px 16px; background: var(--card-bg); color: var(--text-main); border: 1px solid var(--line-color); border-radius: var(--radius-md); font-size: 16px; margin-bottom: 16px; outline: none; }
        input[type="date"] { appearance: none; -webkit-appearance: none; min-height: 48px; }
        
        button.btn { width: 100%; background-color: var(--text-main); color: var(--bg); border: none; padding: 14px; border-radius: var(--radius-md); font-size: 16px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
        
        .box { background: var(--card-bg); padding: 20px; border-radius: var(--radius-md); border: 1px solid var(--line-color); margin-bottom: 16px; }
        
        #loading { display: none; text-align: center; padding: 40px 0; }
        .spinner { width: 32px; height: 32px; border: 3px solid var(--line-color); border-top: 3px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 16px auto; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .view-toggles { display: flex; gap: 8px; margin-bottom: 16px; }
        .toggle-btn { flex: 1; padding: 10px; border-radius: var(--radius-sm); border: 1px solid var(--line-color); background: var(--card-bg); color: var(--text-muted); font-size: 14px; font-weight: 700; cursor: pointer; text-align: center; }
        .toggle-btn.active-toggle { background: var(--text-main); color: var(--bg); border-color: var(--text-main); }

        .day-header { margin-top: 10px; margin-bottom: 14px; font-size: 16px; color: var(--text-main); font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; }
        .timetable { position: relative; padding-left: 16px; margin-bottom: 30px; }
        .timetable::before { content: ''; position: absolute; top: 0; bottom: 0; left: 20px; width: 2px; background-color: var(--line-color); }
        .class-slot { display: flex; align-items: flex-start; margin-bottom: 18px; position: relative; cursor: pointer; transition: opacity 0.2s; }
        .class-slot:active { opacity: 0.7; }
        .class-slot::before { content: ''; position: absolute; left: 0; top: 6px; width: 10px; height: 10px; border-radius: 50%; background-color: var(--line-color); z-index: 1; border: 2px solid var(--bg); }
        .class-slot:not(.free-period)::before { background-color: var(--primary); }
        
        .time-col { width: 70px; flex-shrink: 0; padding-right: 14px; text-align: right; padding-top: 1px; }
        .time-start { font-weight: 700; font-size: 14px; color: var(--text-main); }
        .time-end { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
        
        .info-col { flex-grow: 1; background: var(--card-bg); padding: 14px 18px; border-radius: var(--radius-md); border: 1px solid var(--line-color); margin-left: 8px; position: relative; }
        .class-slot.free-period .info-col { background: transparent; border: 2px dashed var(--line-color); padding: 12px 18px; }
        .class-slot.free-period .subject { color: var(--text-muted); font-weight: 600; font-size: 15px; }
        .subject { font-size: 17px; font-weight: 700; color: var(--text-main); }
        .class-meta { font-size: 13px; color: var(--text-muted); margin-top: 6px; font-weight: 600; display: flex; gap: 8px; align-items: center; }

        .holiday-banner { background: rgba(16, 185, 129, 0.1); border: 1px dashed var(--success); color: var(--success); padding: 16px; border-radius: var(--radius-md); text-align: center; font-weight: 700; font-size: 15px; margin-bottom: 30px; }

        .hw-card { display: flex; flex-direction: column; gap: 12px; position: relative; }
        .hw-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
        .hw-title-group { display: flex; flex-direction: column; gap: 6px; }
        .hw-teacher { font-size: 19px; font-weight: 800; color: var(--text-main); line-height: 1.2; letter-spacing: -0.3px; }
        .hw-subject-badge { font-size: 12px; font-weight: 700; color: var(--text-muted); background: var(--bg); padding: 4px 10px; border-radius: 20px; display: inline-block; align-self: flex-start; }
        .hw-due { font-size: 12px; font-weight: 700; color: var(--danger); background: rgba(239, 68, 68, 0.1); padding: 6px 10px; border-radius: var(--radius-sm); white-space: nowrap; }
        .hw-desc { font-size: 16px; color: var(--text-main); white-space: pre-wrap; line-height: 1.5; font-weight: 500; }
        
        /* Multi-Image Swipe Carousel */
        .hw-image-carousel { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; gap: 8px; scrollbar-width: none; padding-bottom: 4px; }
        .hw-image-carousel::-webkit-scrollbar { display: none; }
        .hw-image-carousel .hw-img { flex: 0 0 92%; height: 200px; object-fit: cover; border-radius: var(--radius-sm); scroll-snap-align: center; border: 1px solid var(--line-color); cursor: pointer; }
        
        #lightbox-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 10000; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); }
        #lightbox-img { max-width: 95%; max-height: 85vh; object-fit: contain; border-radius: 8px; }
        .lightbox-close { position: absolute; top: 40px; right: 20px; background: rgba(255,255,255,0.2); color: white; border: none; width: 40px; height: 40px; border-radius: 50%; font-size: 20px; font-weight: bold; display: flex; align-items: center; justify-content: center; cursor: pointer; }

        .hw-actions { display: flex; gap: 10px; margin-top: 8px; justify-content: flex-end; }
        .action-icon-btn { width: 44px; height: 44px; border-radius: var(--radius-sm); border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; font-weight: bold; }
        .btn-complete { background: rgba(16, 185, 129, 0.15); color: var(--success); }
        .btn-edit { background: var(--bg); color: var(--text-main); border: 1px solid var(--line-color); }
        .btn-hard-delete { background: rgba(239, 68, 68, 0.15); color: var(--danger); }
        
        .history-header { margin-top: 24px; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); font-weight: 800; margin-bottom: 16px; }
        .hw-card.completed { opacity: 0.6; }
        .hw-card.completed .btn-complete, .hw-card.completed .btn-edit { display: none; }
        .btn-restore { background: var(--bg); color: var(--text-main); border: 1px solid var(--line-color); width: 100%; padding: 12px; border-radius: var(--radius-sm); }

        .compact-mode .hw-card { padding: 14px; gap: 8px; }
        .compact-mode .hw-teacher { font-size: 16px; }
        .compact-mode .hw-subject-badge { display: none; }
        .compact-mode .hw-desc { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 15px; margin: 4px 0; }
        .compact-mode .hw-image-carousel { display: none; }
        .compact-mode .hw-actions { margin-top: 4px; }
        .compact-mode .action-icon-btn { width: 36px; height: 36px; }
        .compact-mode .action-icon-btn svg { width: 16px; height: 16px; }

        #countdown-pill {
            display: none; position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
            background: var(--danger); color: white; padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; z-index: 99; box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4); white-space: nowrap; letter-spacing: 0.5px; align-items: center;
        }

        .input-label { display: block; font-size: 13px; font-weight: 700; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
        .modal-content { background: var(--card-bg); padding: 24px; border-radius: var(--radius-md); width: 100%; max-width: 400px; border: 1px solid var(--line-color); box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
        
        .img-upload-btn { display: flex; align-items: center; justify-content: center; gap: 8px; background: var(--bg); border: 2px dashed var(--line-color); padding: 16px; border-radius: var(--radius-md); font-weight: 600; color: var(--text-muted); cursor: pointer; text-align: center; margin-bottom: 16px; }
        .img-preview-container { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 4px; }
        .img-preview-container img { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line-color); }
    </style>
</head>
<body>

    <div id="auth-screen">
        <div id="auth-message" style="font-size: 18px; font-weight: 700;">Verifying Access...</div>
        <div id="auth-prompt" class="box" style="display: none; width: 100%; max-width: 320px;">
            <h2 style="margin-bottom: 8px; font-size: 22px;">Locked</h2>
            <p style="color: var(--text-muted); margin-bottom: 20px; font-size: 15px;">Enter PIN to continue</p>
            <input type="password" id="app-pin-input" placeholder="Enter PIN" style="text-align: center; letter-spacing: 8px; font-size: 20px; font-weight: bold;">
            <p id="auth-error" style="color: var(--danger); margin-bottom: 12px; font-size: 14px; font-weight: 600; display: none;">Incorrect PIN</p>
            <button class="btn" onclick="checkAppPin()">Unlock</button>
        </div>
    </div>

    <div id="countdown-pill">
        <span id="cd-subject" style="opacity: 0.9; margin-right: 4px;"></span>
        <span id="cd-time" style="font-variant-numeric: tabular-nums;"></span>
    </div>

    <div id="lightbox-overlay">
        <button class="lightbox-close" onclick="closeLightbox()">✕</button>
        <img id="lightbox-img" src="">
    </div>

    <div id="edit-modal" class="modal-overlay">
        <div class="modal-content">
            <h2 style="margin-bottom: 20px; font-size: 20px;">Edit Task</h2>
            <input type="hidden" id="edit-id">
            <label class="input-label">Due Date Override</label>
            <input type="text" id="edit-due" placeholder="e.g. Due: Monday, 19/10">
            <label class="input-label">Description</label>
            <textarea id="edit-desc" rows="4"></textarea>
            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <button class="btn" style="background: var(--bg); color: var(--text-main); border: 1px solid var(--line-color);" onclick="closeEditModal()">Cancel</button>
                <button class="btn" onclick="saveEdit()">Save</button>
            </div>
        </div>
    </div>

    <div id="edit-lesson-modal" class="modal-overlay">
        <div class="modal-content">
            <h2 style="margin-bottom: 20px; font-size: 20px;">Edit Lesson Details</h2>
            <input type="hidden" id="edit-lesson-day-index">
            <input type="hidden" id="edit-lesson-class-index">
            <label class="input-label">Subject</label>
            <input type="text" id="edit-lesson-subject" placeholder="e.g. 12A/Ph1a">
            <label class="input-label">Teacher</label>
            <input type="text" id="edit-lesson-teacher" placeholder="e.g. Mr Burn">
            <label class="input-label">Room</label>
            <input type="text" id="edit-lesson-room" placeholder="e.g. SC3JH">
            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <button class="btn" style="background: var(--bg); color: var(--text-main); border: 1px solid var(--line-color);" onclick="closeLessonModal()">Cancel</button>
                <button class="btn" onclick="saveLessonEdit()">Update Schedule</button>
            </div>
        </div>
    </div>

    <div id="app-container">
        <header>
            <span id="app-header-title">Tasks</span>
            <div class="header-actions">
                <button onclick="clearAllData()" title="Clear Data">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path></svg>
                </button>
                <button onclick="cycleTheme()" title="Change Color">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r="2.5"></circle><path d="M13.5 9a4.5 4.5 0 1 1-4.5 4.5"></path><path d="M13.5 13.5v6"></path><path d="M9 13.5H3"></path></svg>
                </button>
                <button id="theme-toggle">
                    <svg id="icon-moon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                </button>
            </div>
        </header>

        <main>
            <div id="tab-dashboard" class="tab-content active">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <span style="font-size: 14px; font-weight: 700; color: var(--text-muted);">Sort:</span>
                        <select id="feed-sort" onchange="renderHomework()" style="width: auto; padding: 8px 14px; margin-bottom: 0; min-height: auto; font-size: 14px; border-radius: var(--radius-sm); border-color: transparent; background: var(--card-bg); font-weight: 600;">
                            <option value="due">Due Date</option>
                            <option value="set">Date Set</option>
                        </select>
                    </div>
                    <button id="compact-toggle" class="toggle-btn" style="width: auto; padding: 8px 14px; display: flex; align-items: center; gap: 6px;" onclick="toggleCompactMode()">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
                        Compact
                    </button>
                </div>
                <div id="homework-list"></div>
                <div id="history-section" style="display: none;">
                    <h2 class="history-header">Completed</h2>
                    <div id="history-list"></div>
                </div>
            </div>

            <div id="tab-add" class="tab-content">
                <div class="box" style="border: none; background: transparent; padding: 0; margin-bottom: 24px;">
                    <div id="add-context-box" style="margin-bottom: 24px; text-align: center;">
                        <div id="context-teacher" style="font-weight: 800; font-size: 26px; color: var(--text-main); letter-spacing: -0.5px;">Assigning Task</div>
                        <div id="context-room" style="font-weight: 600; font-size: 16px; color: var(--text-muted); margin-top: 4px;">Select a subject below</div>
                    </div>
                    
                    <form id="addHwForm">
                        <label class="input-label">Teacher</label>
                        <select id="hw-subject" required>
                            <option value="">Select...</option>
                        </select>
                        
                        <div id="due-date-preview" style="font-size: 15px; color: var(--primary); margin-bottom: 20px; font-weight: 700; padding-left: 14px; border-left: 3px solid var(--primary);">
                            Due: Select a subject first
                        </div>
                        
                        <div style="margin-bottom: 20px;">
                            <label class="input-label">Override Auto Date (Optional)</label>
                            <input type="date" id="custom-due-date" style="margin-bottom: 0;">
                        </div>

                        <label class="input-label">Details</label>
                        <textarea id="hw-desc" placeholder="What's the homework?" rows="3"></textarea>
                        
                        <label class="input-label">Attach Photos</label>
                        <label class="img-upload-btn" for="hw-images">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                            <span id="img-upload-btn-text">Select Photos</span>
                        </label>
                        <input type="file" id="hw-images" accept="image/*" multiple style="display: none;">
                        <div id="image-preview-container" class="img-preview-container"></div>
                        
                        <button type="submit" class="btn" style="margin-top: 12px; font-size: 18px;">Save Task</button>
                    </form>
                </div>
            </div>

            <div id="tab-timetable" class="tab-content">
                <div id="form-section" class="box">
                    <h2 style="margin-bottom: 20px; font-size: 18px; font-weight: 800;">Sync Schedule</h2>
                    <form id="loginForm">
                        <input type="email" id="email" placeholder="Arbor Email" required>
                        <input type="password" id="password" placeholder="Arbor Password" required>
                        <button type="submit" class="btn">Connect & Download</button>
                    </form>
                </div>
                <div id="loading"><div class="spinner"></div><div id="status-text" style="color: var(--text-muted); font-weight: 600; font-size: 14px;">Syncing Schedule...</div></div>
                
                <div id="timetable-controls" class="view-toggles" style="display: none;">
                    <button id="btn-view-today" class="toggle-btn active-toggle" onclick="renderTimetable('today')">Today</button>
                    <button id="btn-view-week" class="toggle-btn" onclick="renderTimetable('week')">Week</button>
                    <button class="toggle-btn" style="display: flex; align-items: center; justify-content: center; gap: 6px;" onclick="showSyncForm()">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
                        Sync
                    </button>
                </div>
                <div id="timetable-hint" style="display:none; text-align:center; font-size:12px; color:var(--text-muted); margin-bottom:15px; font-weight:600;">Tap any lesson to manually edit it.</div>
                <div id="timetable-list"></div>
            </div>
        </main>

        <nav>
            <button class="nav-item active" onclick="switchTab('dashboard', 'Tasks')">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"></path><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
                Tasks
            </button>
            <button class="nav-item" onclick="switchTab('add', 'Add Task')">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                Add
            </button>
            <button class="nav-item" onclick="switchTab('timetable', 'Schedule')">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                Schedule
            </button>
        </nav>
    </div>

    <script>
        let db;
        let countdownInterval = null;
        const themes = ['', 'theme-emerald', 'theme-rose', 'theme-amber', 'theme-amethyst'];
        let currentThemeIdx = parseInt(localStorage.getItem('colorThemeIdx') || '0');
        let currentAttachments = [];

        const sunIcon = `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>`;

        const parseTime = (timeStr) => { 
            try { const [h, m] = (timeStr || "0:0").split(':').map(Number); return (h * 60) + m; } catch(e) { return 0; }
        };
        const formatTime = (mins) => { const h = Math.floor(mins / 60).toString().padStart(2, '0'); const m = (mins % 60).toString().padStart(2, '0'); return `${h}:${m}`; };

        function getMonday(date) {
            const d = new Date(date);
            d.setHours(0,0,0,0);
            const day = d.getDay();
            const diff = d.getDate() - day + (day === 0 ? -6 : 1); 
            return new Date(d.setDate(diff));
        }

        function getWeekTypeIndex(targetDateStr) {
            const anchorStr = localStorage.getItem('syncAnchor');
            if (!anchorStr) return 0;
            const anchorMonday = getMonday(anchorStr);
            const targetMonday = getMonday(targetDateStr);
            const diffTime = Math.abs(targetMonday - anchorMonday);
            const diffWeeks = Math.floor(diffTime / (7 * 24 * 60 * 60 * 1000));
            return diffWeeks % 2; 
        }

        function getDayScheduleAndIndex(targetDate, scheduleArray) {
            const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            const dayName = days[targetDate.getDay()];
            const weekIndex = getWeekTypeIndex(targetDate); 
            
            let matchedDays = [];
            scheduleArray.forEach((d, idx) => {
                if (d.day && d.day.includes(dayName)) matchedDays.push({ obj: d, origIndex: idx });
            });
            
            if(matchedDays.length === 0) return null;
            return matchedDays[weekIndex] || matchedDays[0];
        }

        function startCountdown() {
            if (countdownInterval) clearInterval(countdownInterval);
            function update() {
                try {
                    const schedule = JSON.parse(localStorage.getItem('schedule') || '[]');
                    const pill = document.getElementById('countdown-pill');
                    if (!pill) return; 
                    
                    if (schedule.length === 0) { pill.style.display = 'none'; return; }

                    const now = new Date();
                    const currentMins = now.getHours() * 60 + now.getMinutes();
                    const dayData = getDayScheduleAndIndex(now, schedule);
                    const todaySchedule = dayData ? dayData.obj : null;
                    
                    if (!todaySchedule || todaySchedule.isHoliday || !Array.isArray(todaySchedule.classes) || todaySchedule.classes.length === 0) { 
                        pill.style.display = 'none'; return; 
                    }

                    let nextLesson = null;
                    for (let cls of todaySchedule.classes) {
                        if (!cls.time || cls.rawText === "Free Period") continue;
                        const times = cls.time.split('-');
                        if (times.length !== 2) continue;
                        const start = parseTime(times[0]);

                        if (start > currentMins) {
                            nextLesson = { ...cls, startMins: start };
                            break;
                        }
                    }

                    if (nextLesson) {
                        const startHours = Math.floor(nextLesson.startMins / 60);
                        const startMins = nextLesson.startMins % 60;
                        const targetTime = new Date(now.getFullYear(), now.getMonth(), now.getDate(), startHours, startMins, 0).getTime();
                        const diffSecs = Math.floor((targetTime - Date.now()) / 1000);
                        
                        if (diffSecs <= 0) return; 

                        const h = Math.floor(diffSecs / 3600);
                        const m = Math.floor((diffSecs % 3600) / 60);
                        const s = diffSecs % 60;
                        
                        let timeStr = '';
                        if (h > 0) timeStr += `${h}h `;
                        timeStr += `${m.toString().padStart(2, '0')}m ${s.toString().padStart(2, '0')}s`;

                        document.getElementById('cd-subject').innerText = (nextLesson.teacher || nextLesson.rawText);
                        document.getElementById('cd-time').innerText = timeStr;
                        pill.style.display = 'flex';
                    } else {
                        pill.style.display = 'none';
                    }
                } catch(err) { console.error(err); }
            }
            update();
            countdownInterval = setInterval(update, 1000);
        }

        function renderTimetable(viewType = 'today') {
            const schedule = JSON.parse(localStorage.getItem('schedule') || '[]');
            const list = document.getElementById('timetable-list');
            list.innerHTML = '';
            
            if (schedule.length === 0) { 
                document.getElementById('form-section').style.display = 'block'; 
                document.getElementById('timetable-controls').style.display = 'none'; 
                document.getElementById('timetable-hint').style.display = 'none';
                return; 
            }
            
            document.getElementById('form-section').style.display = 'none'; 
            document.getElementById('timetable-controls').style.display = 'flex';
            document.getElementById('timetable-hint').style.display = 'block';

            document.getElementById('btn-view-today')?.classList.toggle('active-toggle', viewType === 'today');
            document.getElementById('btn-view-week')?.classList.toggle('active-toggle', viewType === 'week');

            let daysToRender = [];
            
            if (viewType === 'today') {
                let targetDate = new Date();
                let dayNum = targetDate.getDay();
                if (dayNum === 0 || dayNum === 6) targetDate.setDate(targetDate.getDate() + (dayNum === 0 ? 1 : 2)); 
                const dayData = getDayScheduleAndIndex(targetDate, schedule);
                if (dayData) {
                    const fallbackWeek = getWeekTypeIndex(targetDate) === 0 ? 'Week A' : 'Week B';
                    daysToRender.push({ ...dayData.obj, globalIndex: dayData.origIndex, weekLabel: dayData.obj.weekLabel || fallbackWeek });
                }
            } else {
                let targetDate = getMonday(new Date());
                for(let i=0; i<5; i++) {
                    const dayData = getDayScheduleAndIndex(targetDate, schedule);
                    if (dayData) {
                        const fallbackWeek = getWeekTypeIndex(targetDate) === 0 ? 'Week A' : 'Week B';
                        daysToRender.push({ ...dayData.obj, globalIndex: dayData.origIndex, weekLabel: dayData.obj.weekLabel || fallbackWeek });
                    }
                    targetDate.setDate(targetDate.getDate() + 1);
                }
            }

            if (daysToRender.length === 0) {
                list.innerHTML = '<div class="box" style="text-align: center; color: var(--text-muted); font-size: 15px;">No classes found.</div>';
                return;
            }

            daysToRender.forEach(daySchedule => {
                const cleanDayName = (daySchedule.day || '').replace(/^\d+\s+/, '');
                const dayHeader = document.createElement('div'); 
                dayHeader.className = 'day-header'; 
                dayHeader.innerHTML = `${cleanDayName} <span style="color: var(--primary); font-size: 13px; font-weight: 800; background: rgba(79, 70, 229, 0.1); padding: 2px 8px; border-radius: 12px; margin-left: 6px;">${daySchedule.weekLabel}</span>`;
                list.appendChild(dayHeader);
                
                // NEW: Render Holiday Banner if tagged
                if (daySchedule.isHoliday || !daySchedule.classes || daySchedule.classes.length === 0) {
                    const banner = document.createElement('div');
                    banner.className = 'holiday-banner';
                    banner.innerText = '🌴 Holiday / No Classes Scheduled';
                    list.appendChild(banner);
                    return; // Skip rendering slots for this day
                }

                const dayTimeline = document.createElement('div'); dayTimeline.className = 'timetable';
                let currentMins = 550; // 09:10
                
                daySchedule.classes.forEach((cls, classIdx) => {
                    const times = (cls.time || "").split('-');
                    if(times.length !== 2) return;
                    const startMins = parseTime(times[0]); const endMins = parseTime(times[1]);
                    
                    if (startMins - currentMins >= 45) {
                        const isLunch = (currentMins >= 740 && startMins <= 815); 
                        if (!isLunch) {
                            const freeSlot = document.createElement('div');
                            freeSlot.className = 'class-slot free-period';
                            freeSlot.innerHTML = `<div class="time-col"><div class="time-start">${formatTime(currentMins)}</div><div class="time-end">${times[0]}</div></div><div class="info-col"><div class="subject">Free Period</div></div>`;
                            dayTimeline.appendChild(freeSlot);
                        }
                    }
                    
                    const slot = document.createElement('div');
                    slot.className = `class-slot`;
                    slot.setAttribute('onclick', `openLessonEditor(${daySchedule.globalIndex}, ${classIdx})`);
                    let metaHTML = '';
                    let metaParts = []; if (cls.teacher) metaParts.push(cls.teacher); if (cls.room) metaParts.push(cls.room);
                    if(metaParts.length > 0) metaHTML = `<div class="class-meta">${metaParts.join(' • ')}</div>`;
                    slot.innerHTML = `<div class="time-col"><div class="time-start">${(times[0] || "").trim()}</div><div class="time-end">${(times[1] || "").trim()}</div></div><div class="info-col"><div class="subject">${cls.rawText}</div>${metaHTML}</div>`;
                    dayTimeline.appendChild(slot);
                    
                    currentMins = endMins;
                });
                
                if (924 - currentMins >= 45) {
                    const freeSlot = document.createElement('div');
                    freeSlot.className = 'class-slot free-period';
                    freeSlot.innerHTML = `<div class="time-col"><div class="time-start">${formatTime(currentMins)}</div><div class="time-end">15:24</div></div><div class="info-col"><div class="subject">Free Period</div></div>`;
                    dayTimeline.appendChild(freeSlot);
                }
                
                list.appendChild(dayTimeline);
            });
        }

        function calculateNextLesson(classKey, schedule) {
            try {
                if(!classKey) return;
                const parts = classKey.split('|');
                const subject = parts[0];
                const teacher = parts[1];
                
                const now = new Date();
                const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
                let nextDate = "Unknown";
                let found = false;

                for(let i = 1; i <= 21; i++) {
                    const checkDate = new Date(now);
                    checkDate.setDate(now.getDate() + i);
                    const checkDayName = days[checkDate.getDay()];
                    
                    const dayData = getDayScheduleAndIndex(checkDate, schedule);
                    const daySchedule = dayData ? dayData.obj : null;
                    
                    if(daySchedule && daySchedule.classes) {
                        const match = daySchedule.classes.find(c => {
                            if (teacher && c.teacher) return c.teacher === teacher; 
                            return c.rawText === subject; 
                        });
                        if(match) {
                            nextDate = `Next Lesson: ${checkDayName}, ${checkDate.getDate()}/${checkDate.getMonth()+1}`;
                            found = true;
                            break;
                        }
                    }
                }
                if(!found) nextDate = "No lesson found in schedule";
                document.getElementById('due-date-preview').innerText = nextDate;
                document.getElementById('due-date-preview').dataset.due = nextDate;
            } catch(err) { console.error(err); }
        }

        // --- IMAGE COMPRESSION LOGIC ---
        function resizeImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 1200;
                        const MAX_HEIGHT = 1200;
                        let width = img.width;
                        let height = img.height;
                        if (width > height) { if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; } } 
                        else { if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; } }
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', 0.8)); // compress to 80% jpeg
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        function parseDueDate(dueStr) {
            if(!dueStr || typeof dueStr !== 'string') return Number.MAX_SAFE_INTEGER;
            const match = dueStr.match(/(\d+)\/(\d+)/);
            if(match) {
                const now = new Date();
                let year = now.getFullYear();
                let month = parseInt(match[2]) - 1; 
                let date = parseInt(match[1]);
                if (month < now.getMonth()) year++;
                return new Date(year, month, date).getTime();
            }
            return Number.MAX_SAFE_INTEGER;
        }

                req.onsuccess = e => {
                    let tasks = e.target.result || [];
                    tasks.forEach(t => { if(!t.dateSet) t.dateSet = parseInt(t.id) || Date.now(); });

                    let activeTasks = tasks.filter(t => t.status !== 'completed');
                    if (sortMethod === 'due') activeTasks.sort((a,b) => parseDueDate(a.due) - parseDueDate(b.due));
                    else activeTasks.sort((a,b) => b.dateSet - a.dateSet);

                    const completedTasks = tasks.filter(t => t.status === 'completed').sort((a,b) => b.id - a.id);

                    if (activeTasks.length === 0) list.innerHTML = '<div class="box" style="text-align: center; color: var(--text-muted); border-style: dashed; padding: 40px 20px; font-size: 15px; font-weight: 600;">No pending tasks.<br>You are all caught up!</div>';
                    else activeTasks.forEach(task => list.appendChild(createTaskCard(task, false)));

                    if (completedTasks.length > 0) {
                        historySection.style.display = 'block';
                        completedTasks.forEach(task => historyList.appendChild(createTaskCard(task, true)));
                    }
                };
            } catch(err) { console.error(err); }
        }

        function createTaskCard(task, isHistory) {
            const card = document.createElement('div');
            card.className = `box hw-card ${isHistory ? 'completed' : ''}`;
            
            let actionBtns = isHistory 
                ? `<button class="action-btn btn-restore" onclick="updateTaskStatus('${task.id}', 'active')">Restore Task</button>` 
                : `<button class="action-icon-btn btn-complete" onclick="updateTaskStatus('${task.id}', 'completed')" title="Complete"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></button>
                   <button class="action-icon-btn btn-edit" onclick="openEditModal('${task.id}')" title="Edit"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg></button>
                   <button class="action-icon-btn btn-hard-delete" onclick="hardDeleteTask('${task.id}')" title="Delete"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg></button>`;
            
            // Build the multi-image carousel
            let imageHTML = '';
            const imagesToRender = task.images && task.images.length > 0 ? task.images : (task.image ? [task.image] : []);
            
            if (imagesToRender.length > 0) {
                imageHTML = `<div class="hw-image-carousel">`;
                imagesToRender.forEach(imgSrc => {
                    imageHTML += `<img src="${imgSrc}" class="hw-img" onclick="openLightbox(this.src)">`;
                });
                imageHTML += `</div>`;
            }
            
            const descHTML = task.desc ? `<div class="hw-desc">${task.desc}</div>` : '';
            const mainTitle = task.teacher ? task.teacher : (task.subject || 'Task');
            const subjectBadge = task.teacher && task.subject ? `<span class="hw-subject-badge">${task.subject}</span>` : '';

            card.innerHTML = `
                <div class="hw-header">
                    <div class="hw-title-group">
                        <span class="hw-teacher">${mainTitle}</span>
                        ${subjectBadge}
                    </div>
                    <span class="hw-due">${task.due || 'No Due Date'}</span>
                </div>
                ${descHTML}
                ${imageHTML}
                <div class="hw-actions">${actionBtns}</div>
            `;
            return card;
        }

        function updateTaskStatus(id, newStatus) {
            try {
                const tx = db.transaction("homework", "readwrite");
                const store = tx.objectStore("homework");
                store.get(id).onsuccess = (e) => { const task = e.target.result; task.status = newStatus; store.put(task); };
                tx.oncomplete = () => renderHomework();
            } catch(err) { console.error(err); }
        }

        function hardDeleteTask(id) {
            if(confirm("Permanently delete this?")) {
                try {
                    const tx = db.transaction("homework", "readwrite");
                    tx.objectStore("homework").delete(id);
                    tx.oncomplete = () => renderHomework();
                } catch(err) { console.error(err); }
            }
        }

        function openEditModal(id) {
            try {
                const tx = db.transaction("homework", "readonly");
                tx.objectStore("homework").get(id).onsuccess = (e) => {
                    const task = e.target.result;
                    document.getElementById('edit-id').value = task.id;
                    document.getElementById('edit-due').value = task.due || '';
                    document.getElementById('edit-desc').value = task.desc || '';
                    document.getElementById('edit-modal').style.display = 'flex';
                };
            } catch(err) { console.error(err); }
        }

        function closeEditModal() { document.getElementById('edit-modal').style.display = 'none'; }

        function saveEdit() {
            try {
                const id = document.getElementById('edit-id').value;
                const tx = db.transaction("homework", "readwrite");
                const store = tx.objectStore("homework");
                store.get(id).onsuccess = (e) => {
                    const task = e.target.result;
                    task.due = document.getElementById('edit-due').value;
                    task.desc = document.getElementById('edit-desc').value;
                    store.put(task);
                };
                tx.oncomplete = () => { closeEditModal(); renderHomework(); };
            } catch(err) { console.error(err); }
        }

        function toggleCompactMode() {
            try {
                const list = document.getElementById('homework-list');
                list.classList.toggle('compact-mode');
                const isCompact = list.classList.contains('compact-mode');
                localStorage.setItem('compactMode', isCompact);
                document.getElementById('compact-toggle').classList.toggle('active-toggle', isCompact);
            } catch(err) { console.error(err); }
        }

        if (localStorage.getItem('compactMode') === 'true') {
            document.getElementById('homework-list').classList.add('compact-mode');
            setTimeout(() => { document.getElementById('compact-toggle').classList.add('active-toggle'); }, 50);
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => { navigator.serviceWorker.register('/sw.js').catch(err => console.log(err)); });
        }
    </script>
</body>
</html>
