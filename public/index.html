<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AutoPlanner</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <style>
        :root {
            --primary: #4f46e5;
            --bg: #f9fafb;
            --card-bg: #ffffff;
            --text-main: #111827;
            --text-muted: #6b7280;
            --line-color: #e5e7eb;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }

        body { 
            background-color: var(--bg); 
            color: var(--text-main); 
            display: flex; 
            flex-direction: column;
            height: 100vh;
            overflow: hidden; /* Prevent body scrolling, allow content area to scroll */
        }

        /* Top Header */
        header {
            background-color: var(--card-bg);
            padding: 16px 20px;
            font-size: 20px;
            font-weight: 700;
            border-bottom: 1px solid var(--line-color);
            text-align: center;
        }

        /* Main Content Area */
        main {
            flex-grow: 1;
            overflow-y: auto;
            padding: 20px;
            padding-bottom: 80px; /* Space for bottom nav */
        }

        /* Tab Views */
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Bottom Navigation */
        nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: var(--card-bg);
            border-top: 1px solid var(--line-color);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            padding-bottom: env(safe-area-inset-bottom, 12px); /* iPhone notch support */
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-muted);
            background: none;
            border: none;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
        }

        .nav-item.active { color: var(--primary); }

        .nav-icon {
            width: 24px;
            height: 24px;
            margin-bottom: 4px;
            border-radius: 4px;
            background-color: currentColor; /* Placeholder for actual SVG icons */
            opacity: 0.2;
        }
        .nav-item.active .nav-icon { opacity: 1; }
    </style>
</head>
<body>

    <header id="app-header">Dashboard</header>

    <main>
        <!-- DASHBOARD TAB -->
        <div id="tab-dashboard" class="tab-content active">
            <h2>Pending Homework</h2>
            <p style="color: var(--text-muted); margin-top: 10px;">Your tasks will appear here.</p>
        </div>

        <!-- ADD HOMEWORK TAB -->
        <div id="tab-add" class="tab-content">
            <h2>Add Homework</h2>
            <p style="color: var(--text-muted); margin-top: 10px;">Auto-detecting current class...</p>
        </div>

        <!-- TIMETABLE TAB -->
        <div id="tab-timetable" class="tab-content">
            <h2>Sync Timetable</h2>
            <!-- We will drop the login form and vertical timeline here next -->
        </div>
    </main>

    <nav>
        <button class="nav-item active" onclick="switchTab('dashboard', 'Dashboard')">
            <div class="nav-icon"></div>
            Tasks
        </button>
        <button class="nav-item" onclick="switchTab('add', 'Add Homework')">
            <div class="nav-icon"></div>
            Add
        </button>
        <button class="nav-item" onclick="switchTab('timetable', 'My Schedule')">
            <div class="nav-icon"></div>
            Timetable
        </button>
    </nav>

    <script>
        // 1. Register Service Worker for Offline Mode
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => console.log('Service Worker registered', reg))
                    .catch(err => console.error('Service Worker failed', err));
            });
        }

        // 2. Tab Switching Logic
        function switchTab(tabId, headerTitle) {
            // Update Header
            document.getElementById('app-header').innerText = headerTitle;

            // Hide all tabs
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });

            // Show selected tab
            document.getElementById('tab-' + tabId).classList.add('active');

            // Update Nav visual state
            document.querySelectorAll('.nav-item').forEach(btn => {
                btn.classList.remove('active');
            });
            event.currentTarget.classList.add('active');
        }
    </script>
</body>
</html>
